<template>
  <div class="backdrop" if:true={showLoading}>
    <div class="loader">
      <img src={loadingGif} alt="Loading..." />
    </div>
  </div>
  <!-- Container with SLDS card styling -->
  <div class="slds-card slds-p-around_medium" id="connectly-container">

    <!-- Title -->
    <div class="slds-m-bottom_large slds-grid">
      <div class="slds-col slds-size_1-of-12">

      </div>
      <div class="slds-col slds-size_10-of-12" id="connectly-title">
        <div class="slds-text-heading_large slds-align_absolute-center">
          <strong>Communication Hub</strong>
        </div>

      </div>
      <!--more menu-->
      <div class="slds-col slds-size_1-of-12">
        <div class="slds-float_right">
          <div class={more_Menu}>
            <button class="slds-button slds-button_icon slds-button_icon-border-filled" aria-haspopup="true"
              aria-expanded="true" title="Show More" onclick={onMenuClick}>
              <svg class="slds-button__icon" aria-hidden="true">
                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#down"></use>
              </svg>
              <span class="slds-assistive-text">Show More</span>
            </button>
            <div class="slds-dropdown slds-dropdown_right">
              <ul class="slds-dropdown__list" role="menu" aria-label="Show More">
                <li class="slds-dropdown__item" role="presentation">
                  <a href="#" role="menuitem" tabindex="0">
                    <span class="slds-truncate" title="Menu Item One" onclick={openActivityTimeline}>Activity Timeline</span>
                  </a>
                </li>
                <li class="slds-dropdown__item" role="presentation">
                  <a href="#" role="menuitem" tabindex="-1">
                    <span class="slds-truncate" title="Menu Item Two">Settings</span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button Group -->
    <div class="slds-m-bottom_small slds-m-right_xx-large">
      <div class="slds-grid slds-gutters slds-align_absolute-center" id="connectly-buttons">

        <!-- Call Button -->
        <div class="slds-col">
          <div class="slds-align_absolute-center">
            <a href="#">
              <lightning-icon icon-name="action:call" alternative-text="Call" title="Call" size="medium"
                onclick={onbuttonClick} name="call"></lightning-icon>
            </a>
          </div>

        </div>

        <!-- Email Button -->
        <div class="slds-col">
          <div class="slds-align_absolute-center">
            <a href="#">
              <lightning-icon icon-name="action:email" alternative-text="Email" title="Email" size="medium"
                onclick={onbuttonClick} name="email"></lightning-icon>
            </a>
          </div>

        </div>

        <!-- Message Button -->
        <div class="slds-col">
          <div class="slds-align_absolute-center">
            <a href="#">
              <lightning-icon icon-name="action:share_post" alternative-text="Chat" title="Chat" size="medium"
                onclick={onbuttonClick} name="chat"></lightning-icon>
            </a>
          </div>

        </div>
        <!--Whatsapp button-->
        <div class="slds-col">
          <div class="slds-align_absolute-center">
            <a href="#">
              <!--this whatsapp feature has not been developed yet-->
              <!-- <lightning-icon src={whatsapp_logo} title="whatsapp" name="whatsapp" 
              alternative-text="whatsapp icon" size="medium"></lightning-icon> -->
              <img src={whatsapp_logo} alt="whatsapp" class="slds-size_small whatsappIcon" onclick={onWhatsappClick} />
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
  <!-- modal start -->
  <template lwc:if={composer.isVisible}>
    <div class="slds-docked_container">
      <section class={composerClass} role="dialog" aria-labelledby="dialog-heading-id-1"
        aria-describedby="dialog-content-id-1">
        <!-- header start -->
        <header class="slds-docked-composer__header slds-grid slds-shrink-none" aria-live="assertive">
          <div class="slds-media slds-media_center slds-no-space">
            <div class="slds-media__figure slds-m-right_x-small">
              <span class="slds-icon_container">
                <lightning-icon icon-name={headerIconName} alternative-text="headerIcon" title="headerIcon"
                  size="x-small">
                </lightning-icon>
              </span>
            </div>
            <div class="slds-media__body">
              <h2 class="slds-truncate" id="dialog-heading-id-1" title="headerTitle">{headerTitle}</h2>
            </div>
          </div>
          <div class="slds-col_bump-left slds-shrink-none">
            <button class="slds-button slds-button_icon slds-m-right_large" title="einstein">
              <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#sparkles"></use>
              </svg>
            </button>
            <button class="slds-button slds-button_icon slds-button_icon" title="Minimize window">
              <!-- <svg class="slds-button__icon" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#minimize_window"></use>
              </svg> -->
              <lightning-icon icon-name="utility:minimize_window" alternative-text="minimize" title="minimize"
                size="x-small" onclick={onHeaderButtonClick} name="minimize">
              </lightning-icon>
              <!-- <span class="slds-assistive-text">Minimize Composer Panel</span> -->
            </button>
            <button class="slds-button slds-button_icon slds-button_icon" title="Expand Composer">
              <!-- <svg class="slds-button__icon" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#expand_alt"></use>
              </svg>
              <span class="slds-assistive-text">Expand Composer Panel</span> -->
              <lightning-icon icon-name="utility:expand_alt" alternative-text="expand" title="expand" size="x-small"
                onclick={onHeaderButtonClick} name="expand">
              </lightning-icon>
            </button>
            <button class="slds-button slds-button_icon slds-button_icon" title="Close">
              <!-- <svg class="slds-button__icon" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
              </svg>
              <span class="slds-assistive-text">Close Composer Panel</span> -->
              <lightning-icon icon-name="utility:close" alternative-text="close" title="close" size="x-small"
                onclick={onHeaderButtonClick} name="close"></lightning-icon>
            </button>
          </div>
        </header>
        <!-- header end -->
        <!-- body start -->
        <!-- Email start -->

        <!-- Call Start -->
        <template lwc:elseif={channelManagement.call}>
          <div class="slds-docked-composer__body slds-align_absolute-center" id="dialog-content-id-2">
            <div class="slds-text-align_center slds-align-middle">
              <span class="slds-avatar slds-avatar_large">
                <img alt="" src="https://v1.lightningdesignsystem.com/assets/images/avatar2.jpg"
                  title="Lei Chan avatar" />
              </span>
              <h3 class="slds-text-heading_large">{name}</h3>
              <ul class="slds-list_horizontal slds-has-dividers_right slds-text-body_small">
                <li class="slds-item">{title}</li>
                <li class="slds-item ">{company}</li>
              </ul>
              <template lwc:if={isCallConfirmed}>
                <div class="slds-m-top_medium">
                  <lightning-dynamic-icon type="ellie" alternative-text="Ellie intelligence" class="display-inline">
                  </lightning-dynamic-icon>
                  <p class="slds-text-heading_medium slds-m-left_small display-inline">Connecting...</p>
                </div>
              </template>
              <template lwc:else>
                <div class="slds-m-top_medium">
                  <lightning-button variant="brand" label=" Call " title="Primary action" onclick={confirmingCall}
                    class="slds-m-left_x-small"></lightning-button>
                  <lightning-button label="Cancel" title="Non-primary action" onclick={onHeaderButtonClick}
                    class="slds-m-left_x-small" name="close"></lightning-button>
                </div>
              </template>
            </div>
          </div>
          <footer class="slds-docked-composer__footer slds-shrink-none">
            <button class="slds-button slds-button_destructive slds-size_1-of-1">End Call</button>
          </footer>
        </template>
        <!-- Call end -->
        <!-- Chat Start -->
        <template lwc:elseif={channelManagement.chat}>
          <div class="slds-docked-composer__body slds-scrollable_y scroll-container fixed-body-height"
            id="dialog-content-id-3">
            <!-- <section role="log" class="slds-chat"> -->
            <div class="slds-chat">
              <ul class="slds-chat-list" role="log">
                <template for:each={chat_records} for:item="item">
                  <div key={item.Id}>
                    <li class={item.class_li}>
                      <div class="slds-chat-message">
                        <div class="slds-chat-message__body">
                          <div class={item.class_div}>
                            <span>{item.content}</span>
                          </div>
                          <div class="slds-chat-message__meta" aria-label="said Amber Cann at 5:23 PM">D •
                            {item.DateTime}</div>
                        </div>
                      </div>
                    </li>
                  </div>
                </template>
              </ul>
              <!-- </section> -->
            </div>
          </div>
          <!-- <div class="slds-docked-composer__footer slds-shrink-none"></div> -->
          <div class="footer-height slds-m-left_x-small slds-m-right_x-small slds-m-bottom_small">
            <div class="slds-grid">
              <div class="slds-col slds-size_11-of-12">
                <lightning-textarea id="text-input-id-126" placeholder="Type message…" onchange={handleMessageChange}
                  value={message}></lightning-textarea>
              </div>
              <div class="slds-col slds-size_1-of-12 slds-grid slds-wrap slds-m-top_medium">
                <div class="slds-col slds-size_1-of-1">
                  <button class="slds-button slds-button_icon slds-button_icon-brand send-button slds-m-left_xx-small" 
                  onclick={handleSend} title="Send Message">
                    <svg class="slds-button__icon slds-button__icon_small" aria-hidden="true">
                      <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#send"></use>
                    </svg></button>
                </div>

                    <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                      <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#einstein"></use>
                    </svg>GenAI</button>
                </div> -->
              </div>
            </div>
          </div>
          <!-- <footer class="slds-docked-composer__footer slds-shrink-none chat-footer">

              <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">

                  <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#send"></use>
                </svg>

                  onchange={handleMessageChange} onkeypress={handleEnter}>{message}</textarea>
              </div>
            </div>
          </footer> -->
